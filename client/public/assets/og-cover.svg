<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0a0a0c"/>
      <stop offset="100%" stop-color="#1a0a0a"/>
    </linearGradient>
    <linearGradient id="redGlow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8b1a1a" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#8b1a1a" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  
  <!-- Red border frame -->
  <rect x="16" y="16" width="1168" height="598" fill="none" stroke="#8b1a1a" stroke-width="2" opacity="0.6"/>
  <rect x="24" y="24" width="1152" height="582" fill="none" stroke="#8b1a1a" stroke-width="1" opacity="0.3"/>
  
  <!-- Top red glow -->
  <rect x="0" y="0" width="1200" height="200" fill="url(#redGlow)"/>
  
  <!-- Decorative cross-hatch pattern -->
  <g opacity="0.04">
    <line x1="0" y1="0" x2="1200" y2="630" stroke="#8b1a1a" stroke-width="1"/>
    <line x1="1200" y1="0" x2="0" y2="630" stroke="#8b1a1a" stroke-width="1"/>
    <line x1="600" y1="0" x2="600" y2="630" stroke="#8b1a1a" stroke-width="1"/>
    <line x1="0" y1="315" x2="1200" y2="315" stroke="#8b1a1a" stroke-width="1"/>
  </g>
  
  <!-- Top label -->
  <text x="600" y="130" text-anchor="middle" fill="#8b1a1a" font-family="monospace" font-size="14" font-weight="bold" letter-spacing="12">INDEPENDENT INVESTIGATION // 2026</text>
  
  <!-- Main title: SODOM HALL -->
  <text x="600" y="260" text-anchor="middle" fill="#ffffff" font-family="'Cinzel', 'Times New Roman', serif" font-size="108" font-weight="900" letter-spacing="8" filter="url(#glow)">SODOM HALL</text>
  
  <!-- Red underline -->
  <rect x="350" y="280" width="500" height="4" fill="#cc0000" rx="2"/>
  
  <!-- Subtitle -->
  <text x="600" y="330" text-anchor="middle" fill="#c8bdb0" font-family="'Cormorant Garamond', 'Georgia', serif" font-size="28" font-style="italic">The Cathedral of Documents</text>
  
  <!-- Divider -->
  <line x1="450" y1="360" x2="750" y2="360" stroke="#8b1a1a" stroke-width="1" opacity="0.5"/>
  
  <!-- Headline -->
  <text x="600" y="410" text-anchor="middle" fill="#e8e0d6" font-family="'Georgia', serif" font-size="24" font-weight="bold">Judge Orders Release of Hidden Reports —</text>
  <text x="600" y="445" text-anchor="middle" fill="#e8e0d6" font-family="'Georgia', serif" font-size="24" font-weight="bold">20,000+ Pages Expose Decades of Cover-Up</text>
  
  <!-- Bottom info -->
  <text x="600" y="520" text-anchor="middle" fill="#666" font-family="monospace" font-size="13" letter-spacing="6">SODOMHALL.COM</text>
  
  <!-- Byline -->
  <text x="600" y="550" text-anchor="middle" fill="#555" font-family="monospace" font-size="11" letter-spacing="4">BY DEI JOURNO</text>
  
  <!-- Corner decorations -->
  <rect x="40" y="40" width="20" height="2" fill="#8b1a1a" opacity="0.5"/>
  <rect x="40" y="40" width="2" height="20" fill="#8b1a1a" opacity="0.5"/>
  <rect x="1140" y="40" width="20" height="2" fill="#8b1a1a" opacity="0.5"/>
  <rect x="1158" y="40" width="2" height="20" fill="#8b1a1a" opacity="0.5"/>
  <rect x="40" y="588" width="20" height="2" fill="#8b1a1a" opacity="0.5"/>
  <rect x="40" y="570" width="2" height="20" fill="#8b1a1a" opacity="0.5"/>
  <rect x="1140" y="588" width="20" height="2" fill="#8b1a1a" opacity="0.5"/>
  <rect x="1158" y="570" width="2" height="20" fill="#8b1a1a" opacity="0.5"/>
</svg>
